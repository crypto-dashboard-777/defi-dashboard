name: Refresh DeFi Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6h UTC (midnight, 6am, noon, 6pm)
  workflow_dispatch:           # manual trigger via GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Refresh positions
        env:
          DEBANK_WALLET: ${{ vars.DEBANK_WALLET || '0xe16be042f9433779909a972669be3a2003956348' }}
          SOL_WALLET: ${{ vars.SOL_WALLET || '36RwE5mMFqZhkMrC445AYXSQpj8xDtRLC3QfnNx18e1F' }}
          OFFCHAIN_USD: '0'
        run: python outputs/refresh_positions.py

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/history.html _site/history.html
          touch _site/.nojekyll

      - name: Commit snapshot and data back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/history.html outputs/snapshots/ outputs/debank_positions_log.xlsx
          git diff --staged --quiet || git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
