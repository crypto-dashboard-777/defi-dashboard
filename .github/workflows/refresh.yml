name: Refresh DeFi Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6h UTC (midnight, 6am, noon, 6pm)
  workflow_dispatch:           # manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Refresh positions
        env:
          DEBANK_WALLET: ${{ vars.DEBANK_WALLET || '0xe16be042f9433779909a972669be3a2003956348' }}
          SOL_WALLET: ${{ vars.SOL_WALLET || '6QcRFrTcHCZgKdtX83iusXVBvcz3vrwiKayREZtJBx5o' }}
          OFFCHAIN_USD: '0'
        run: python outputs/refresh_positions.py

      - name: Publish to GitHub Pages root
        run: |
          # Copy dashboard to repo root so GitHub Pages (served from /) picks it up
          cp docs/index.html index.html
          cp docs/history.html history.html
          # Prevent Jekyll from mangling our self-contained HTML
          touch .nojekyll

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html history.html index.html .nojekyll outputs/snapshots/ outputs/debank_positions_log.xlsx
          git diff --staged --quiet || git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
